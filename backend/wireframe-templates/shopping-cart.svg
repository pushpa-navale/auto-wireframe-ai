<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="80" fill="#2c3e50" stroke="#34495e" stroke-width="1"/>
  <text x="50" y="30" font-family="Arial, sans-serif" font-size="20" fill="white">E-Commerce Store</text>
  <rect x="600" y="20" width="80" height="30" fill="#3498db" stroke="#2980b9" stroke-width="1" rx="4"/>
  <text x="640" y="40" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Cart (3)</text>

  <!-- Breadcrumb -->
  <text x="50" y="110" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Home > Shopping Cart</text>

  <!-- Cart Title -->
  <text x="50" y="140" font-family="Arial, sans-serif" font-size="24" fill="#2c3e50">Shopping Cart</text>

  <!-- Cart Items -->
  <rect x="50" y="160" width="500" height="80" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <!-- Product Image -->
  <rect x="60" y="170" width="60" height="60" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1"/>
  <!-- Product Info -->
  <text x="140" y="190" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">Product Name 1</text>
  <text x="140" y="210" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">Color: Blue, Size: M</text>
  <text x="140" y="230" font-family="Arial, sans-serif" font-size="16" fill="#e74c3c">$29.99</text>
  <!-- Quantity -->
  <rect x="400" y="185" width="30" height="25" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="415" y="202" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">1</text>
  <!-- Remove -->
  <rect x="450" y="185" width="80" height="25" fill="#e74c3c" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="490" y="202" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Remove</text>

  <!-- Cart Item 2 -->
  <rect x="50" y="250" width="500" height="80" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="60" y="260" width="60" height="60" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1"/>
  <text x="140" y="280" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">Product Name 2</text>
  <text x="140" y="300" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">Color: Red, Size: L</text>
  <text x="140" y="320" font-family="Arial, sans-serif" font-size="16" fill="#e74c3c">$49.99</text>
  <rect x="400" y="275" width="30" height="25" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="415" y="292" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">2</text>
  <rect x="450" y="275" width="80" height="25" fill="#e74c3c" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="490" y="292" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Remove</text>

  <!-- Cart Item 3 -->
  <rect x="50" y="340" width="500" height="80" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="60" y="350" width="60" height="60" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1"/>
  <text x="140" y="370" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">Product Name 3</text>
  <text x="140" y="390" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">Color: Green, Size: S</text>
  <text x="140" y="410" font-family="Arial, sans-serif" font-size="16" fill="#e74c3c">$19.99</text>
  <rect x="400" y="365" width="30" height="25" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="415" y="382" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">1</text>
  <rect x="450" y="365" width="80" height="25" fill="#e74c3c" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="490" y="382" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Remove</text>

  <!-- Order Summary -->
  <rect x="580" y="160" width="200" height="260" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="590" y="185" font-family="Arial, sans-serif" font-size="18" fill="#2c3e50">Order Summary</text>

  <!-- Subtotal -->
  <text x="590" y="220" font-family="Arial, sans-serif" font-size="14" fill="#495057">Subtotal (3 items):</text>
  <text x="770" y="220" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#2c3e50">$99.97</text>

  <!-- Shipping -->
  <text x="590" y="245" font-family="Arial, sans-serif" font-size="14" fill="#495057">Shipping:</text>
  <text x="770" y="245" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#2c3e50">$9.99</text>

  <!-- Tax -->
  <text x="590" y="270" font-family="Arial, sans-serif" font-size="14" fill="#495057">Tax:</text>
  <text x="770" y="270" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#2c3e50">$8.00</text>

  <!-- Total -->
  <rect x="580" y="290" width="200" height="2" fill="#dee2e6"/>
  <text x="590" y="315" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">Total:</text>
  <text x="770" y="315" font-family="Arial, sans-serif" font-size="16" text-anchor="end" fill="#e74c3c">$117.96</text>

  <!-- Checkout Button -->
  <rect x="580" y="340" width="200" height="50" fill="#27ae60" stroke="#229954" stroke-width="1" rx="4"/>
  <text x="680" y="370" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="white">Proceed to Checkout</text>

  <!-- Continue Shopping -->
  <rect x="580" y="400" width="200" height="40" fill="#3498db" stroke="#2980b9" stroke-width="1" rx="4"/>
  <text x="680" y="425" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white">Continue Shopping</text>
</svg>