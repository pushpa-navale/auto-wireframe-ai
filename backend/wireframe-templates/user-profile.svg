<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="80" fill="#2c3e50" stroke="#34495e" stroke-width="1"/>
  <text x="50" y="30" font-family="Arial, sans-serif" font-size="20" fill="white">E-Commerce Store</text>
  <rect x="600" y="20" width="80" height="30" fill="#3498db" stroke="#2980b9" stroke-width="1" rx="4"/>
  <text x="640" y="40" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Cart (0)</text>

  <!-- Sidebar Navigation -->
  <rect x="0" y="80" width="200" height="520" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="100" y="110" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2c3e50">My Account</text>

  <!-- Navigation Items -->
  <rect x="20" y="130" width="160" height="30" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
  <text x="100" y="150" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Profile</text>

  <rect x="20" y="170" width="160" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="100" y="190" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">Order History</text>

  <rect x="20" y="210" width="160" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="100" y="230" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">Addresses</text>

  <rect x="20" y="250" width="160" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="100" y="270" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">Payment Methods</text>

  <rect x="20" y="290" width="160" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="100" y="310" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">Wishlist</text>

  <rect x="20" y="330" width="160" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="100" y="350" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">Settings</text>

  <!-- Main Content -->
  <rect x="200" y="80" width="600" height="520" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="220" y="110" font-family="Arial, sans-serif" font-size="24" fill="#2c3e50">My Profile</text>

  <!-- Profile Picture -->
  <circle cx="300" cy="160" r="40" fill="#e9ecef" stroke="#dee2e6" stroke-width="2"/>
  <text x="300" y="170" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#6c757d">Photo</text>

  <!-- Personal Information -->
  <text x="220" y="230" font-family="Arial, sans-serif" font-size="18" fill="#2c3e50">Personal Information</text>

  <!-- First Name -->
  <text x="220" y="260" font-family="Arial, sans-serif" font-size="14" fill="#495057">First Name</text>
  <rect x="220" y="265" width="180" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="230" y="285" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">John</text>

  <!-- Last Name -->
  <text x="420" y="260" font-family="Arial, sans-serif" font-size="14" fill="#495057">Last Name</text>
  <rect x="420" y="265" width="180" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="430" y="285" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Doe</text>

  <!-- Email -->
  <text x="220" y="310" font-family="Arial, sans-serif" font-size="14" fill="#495057">Email Address</text>
  <rect x="220" y="315" width="380" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="230" y="335" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">john.doe@example.com</text>

  <!-- Phone -->
  <text x="220" y="360" font-family="Arial, sans-serif" font-size="14" fill="#495057">Phone Number</text>
  <rect x="220" y="365" width="180" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="230" y="385" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">(555) 123-4567</text>

  <!-- Date of Birth -->
  <text x="420" y="360" font-family="Arial, sans-serif" font-size="14" fill="#495057">Date of Birth</text>
  <rect x="420" y="365" width="180" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="430" y="385" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">01/15/1990</text>

  <!-- Account Preferences -->
  <text x="220" y="420" font-family="Arial, sans-serif" font-size="18" fill="#2c3e50">Account Preferences</text>

  <!-- Newsletter -->
  <rect x="220" y="440" width="20" height="20" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="250" y="455" font-family="Arial, sans-serif" font-size="14" fill="#495057">Subscribe to newsletter</text>

  <!-- SMS Notifications -->
  <rect x="220" y="470" width="20" height="20" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="250" y="485" font-family="Arial, sans-serif" font-size="14" fill="#495057">Receive SMS notifications</text>

  <!-- Email Notifications -->
  <rect x="220" y="500" width="20" height="20" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="250" y="515" font-family="Arial, sans-serif" font-size="14" fill="#495057">Receive email notifications</text>

  <!-- Save Button -->
  <rect x="650" y="520" width="120" height="40" fill="#27ae60" stroke="#229954" stroke-width="1" rx="4"/>
  <text x="710" y="545" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white">Save Changes</text>

  <!-- Recent Orders -->
  <text x="220" y="450" font-family="Arial, sans-serif" font-size="18" fill="#2c3e50">Recent Orders</text>
  <rect x="620" y="430" width="160" height="80" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="630" y="450" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Order #12345</text>
  <text x="630" y="470" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Placed: 2 days ago</text>
  <text x="630" y="490" font-family="Arial, sans-serif" font-size="14" fill="#27ae60">Delivered</text>
  <text x="760" y="505" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#2c3e50">View Details</text>
</svg>