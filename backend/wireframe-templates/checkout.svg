<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="80" fill="#2c3e50" stroke="#34495e" stroke-width="1"/>
  <text x="50" y="30" font-family="Arial, sans-serif" font-size="20" fill="white">E-Commerce Store</text>
  <rect x="600" y="20" width="80" height="30" fill="#3498db" stroke="#2980b9" stroke-width="1" rx="4"/>
  <text x="640" y="40" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Cart (3)</text>

  <!-- Breadcrumb -->
  <text x="50" y="110" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Home > Shopping Cart > Checkout</text>

  <!-- Checkout Title -->
  <text x="50" y="140" font-family="Arial, sans-serif" font-size="24" fill="#2c3e50">Checkout</text>

  <!-- Shipping Information -->
  <rect x="50" y="160" width="350" height="250" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="60" y="185" font-family="Arial, sans-serif" font-size="18" fill="#2c3e50">Shipping Information</text>

  <!-- First Name -->
  <text x="60" y="215" font-family="Arial, sans-serif" font-size="14" fill="#495057">First Name *</text>
  <rect x="60" y="220" width="160" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="70" y="240" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">John</text>

  <!-- Last Name -->
  <text x="235" y="215" font-family="Arial, sans-serif" font-size="14" fill="#495057">Last Name *</text>
  <rect x="235" y="220" width="160" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="245" y="240" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">Doe</text>

  <!-- Email -->
  <text x="60" y="265" font-family="Arial, sans-serif" font-size="14" fill="#495057">Email Address *</text>
  <rect x="60" y="270" width="335" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="70" y="290" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">john.doe@example.com</text>

  <!-- Address -->
  <text x="60" y="315" font-family="Arial, sans-serif" font-size="14" fill="#495057">Street Address *</text>
  <rect x="60" y="320" width="335" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="70" y="340" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">123 Main Street</text>

  <!-- City/State/ZIP -->
  <text x="60" y="365" font-family="Arial, sans-serif" font-size="14" fill="#495057">City *</text>
  <rect x="60" y="370" width="100" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="70" y="390" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">New York</text>

  <text x="175" y="365" font-family="Arial, sans-serif" font-size="14" fill="#495057">State *</text>
  <rect x="175" y="370" width="80" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="185" y="390" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">NY</text>

  <text x="270" y="365" font-family="Arial, sans-serif" font-size="14" fill="#495057">ZIP Code *</text>
  <rect x="270" y="370" width="125" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="280" y="390" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">10001</text>

  <!-- Payment Information -->
  <rect x="50" y="430" width="350" height="200" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="60" y="455" font-family="Arial, sans-serif" font-size="18" fill="#2c3e50">Payment Information</text>

  <!-- Card Number -->
  <text x="60" y="485" font-family="Arial, sans-serif" font-size="14" fill="#495057">Card Number *</text>
  <rect x="60" y="490" width="335" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="70" y="510" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">**** **** **** 1234</text>

  <!-- Expiry/CVV -->
  <text x="60" y="535" font-family="Arial, sans-serif" font-size="14" fill="#495057">Expiry Date *</text>
  <rect x="60" y="540" width="100" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="70" y="560" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">12/25</text>

  <text x="175" y="535" font-family="Arial, sans-serif" font-size="14" fill="#495057">CVV *</text>
  <rect x="175" y="540" width="80" height="30" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="185" y="560" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">123</text>

  <!-- Order Summary -->
  <rect x="430" y="160" width="320" height="470" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="440" y="185" font-family="Arial, sans-serif" font-size="18" fill="#2c3e50">Order Summary</text>

  <!-- Order Items -->
  <rect x="440" y="200" width="300" height="60" fill="#ffffff" stroke="#e9ecef" stroke-width="1"/>
  <text x="450" y="220" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Product Name 1</text>
  <text x="450" y="240" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Qty: 1</text>
  <text x="720" y="230" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#2c3e50">$29.99</text>

  <rect x="440" y="270" width="300" height="60" fill="#ffffff" stroke="#e9ecef" stroke-width="1"/>
  <text x="450" y="290" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Product Name 2</text>
  <text x="450" y="310" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Qty: 2</text>
  <text x="720" y="300" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#2c3e50">$99.98</text>

  <rect x="440" y="340" width="300" height="60" fill="#ffffff" stroke="#e9ecef" stroke-width="1"/>
  <text x="450" y="360" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Product Name 3</text>
  <text x="450" y="380" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Qty: 1</text>
  <text x="720" y="370" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#2c3e50">$19.99</text>

  <!-- Totals -->
  <rect x="430" y="420" width="320" height="2" fill="#dee2e6"/>
  <text x="440" y="445" font-family="Arial, sans-serif" font-size="14" fill="#495057">Subtotal:</text>
  <text x="720" y="445" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#2c3e50">$149.96</text>

  <text x="440" y="470" font-family="Arial, sans-serif" font-size="14" fill="#495057">Shipping:</text>
  <text x="720" y="470" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#2c3e50">$9.99</text>

  <text x="440" y="495" font-family="Arial, sans-serif" font-size="14" fill="#495057">Tax:</text>
  <text x="720" y="495" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#2c3e50">$12.00</text>

  <rect x="430" y="510" width="320" height="2" fill="#dee2e6"/>
  <text x="440" y="535" font-family="Arial, sans-serif" font-size="18" fill="#2c3e50">Total:</text>
  <text x="720" y="535" font-family="Arial, sans-serif" font-size="18" text-anchor="end" fill="#e74c3c">$171.95</text>

  <!-- Place Order Button -->
  <rect x="430" y="560" width="320" height="50" fill="#27ae60" stroke="#229954" stroke-width="1" rx="4"/>
  <text x="590" y="590" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="white">Place Order</text>
</svg>