name: Wireframe Generation on Issue

permissions:
  contents: write

on:
  issues:
    types: [opened, edited]

jobs:
  generate-wireframe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install backend dependencies
        run: |
          cd backend
          npm install
      - name: Install frontend dependencies
        run: |
          cd frontend-demo
          npm install || true
      - name: Run wireframe generation
        run: |
          cd backend
          node generate-wireframe.js
      - name: Commit and push wireframe
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend-demo/public/wireframe.svg
          git commit -m "Auto-generate wireframe for issue ${{ github.event.issue.number }}" || true
          git push || echo "No changes to commit"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
