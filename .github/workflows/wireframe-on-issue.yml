name: Wireframe Generation on Issue

permissions:
  contents: write

on:
  issues:
    types: [opened, edited]

jobs:
  generate-wireframe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install backend dependencies
        run: |
          cd backend
          npm install
      - name: Install frontend dependencies
        run: |
          cd frontend-demo
          npm install || true
      - name: Analyze issue and generate wireframe
        run: |
          cd backend
          # Escape special characters in issue title and description for shell
          ISSUE_TITLE=$(echo "${{ github.event.issue.title }}" | sed 's/"/\\"/g')
          ISSUE_DESC=$(echo "${{ github.event.issue.body }}" | sed 's/"/\\"/g' | head -c 500)
          echo "Analyzing issue: $ISSUE_TITLE"
          node generate-wireframe.js issueTitle="$ISSUE_TITLE" issueDescription="$ISSUE_DESC" issueNumber="${{ github.event.issue.number }}"
      - name: Commit and push wireframe
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f frontend-demo/public/wireframe.svg ]; then
            git add frontend-demo/public/wireframe.svg
            git commit -m "🤖 Auto-generated wireframe for issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}" || true
            git push
          else
            echo "No wireframe file was generated"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
