name: Wireframe Generation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  generate-wireframe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install backend dependencies
        run: |
          cd backend
          npm install
      - name: Install frontend dependencies
        run: |
          cd frontend-demo
          npm install || true
      - name: Run wireframe generation
        run: |
          cd backend
          node generate-wireframe.js
      - name: Commit and push wireframe
        run: |
          if [ -f frontend-demo/public/wireframe.svg ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add frontend-demo/public/wireframe.svg
            git commit -m "Auto-generate wireframe [skip ci]" || true
            git push
          fi
